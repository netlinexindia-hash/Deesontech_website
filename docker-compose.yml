version: "3.9"

services:
  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deesontech_db
      POSTGRES_USER: deesontech_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deesontech_user -d deesontech_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend API Server ----
  server:
    image: deesontech/website:server-v1.0
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://deesontech_user:${POSTGRES_PASSWORD:-changeme}@db:5432/deesontech_db
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  # ---- Frontend (Nginx) ----
  client:
    image: deesontech/website:client-v1.0
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
